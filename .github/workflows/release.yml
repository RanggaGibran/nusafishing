name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          name: "Release ${{ github.ref_name }}"
          body: |
            ## NusaFishing ${{ github.ref_name }}

            ### What's Changed
            - **Build System Migration**: Migrated from Maven to Gradle Kotlin DSL supporting Java Multi-Release JAR (`--release 21` baseline for Spigot/Paper 1.21.x and `META-INF/versions/25` for Paper 26.2+).
            - **Custom Texture Providers**: Full abstraction and integration for **Nexo**, **Oraxen**, and **ItemsAdder** with graceful vanilla `CustomModelData` fallback.
            - **Fishing Rod & Fish Textures**: Configurable `texture_provider` and `texture_id` support per fish species and fishing rod.
            - **Bait System Fixes**: Fixed bait detection (inventory & off-hand), hook wait time reduction (`FishHook.setWaitTime`), proper usage deduction, and application of attraction, tier, quality, and weight boosts.
            - **Cross-Version API Compatibility**: Modern particle and enchantment resolution across Paper 1.21.0 through 26.2+.
            - **Automated Workflows**: GitHub Actions CI build and automated release workflows.
          generate_release_notes: true
